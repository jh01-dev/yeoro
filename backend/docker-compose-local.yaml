services:
  postgres:
    image: postgres:16-alpine
    container_name: yeoro-postgres
    environment:
      POSTGRES_DB: yeoro
      POSTGRES_USER: yeoro
      POSTGRES_PASSWORD: yeoro-local-password
    ports:
      - "5432:5432"
    volumes:
      - yeoro-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yeoro-postgres-data:
